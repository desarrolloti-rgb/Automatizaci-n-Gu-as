# Archivo: deploy/guias-proxy.conf
# Se copia a /etc/nginx/snippets/. La app vive bajo /gd/ pero Spring no lo sabe: acá se
# quita el prefijo antes de reenviar. Lo que vuelve lo corrige el frontend, compilado con
# --base-href /gd/.
#
# El prefijo se quita con rewrite y el proxy_pass va SIN URI, a proposito. Si el proxy_pass
# terminara en "/", nginx reemplazaria el trozo que matcheo la location: en "location /gd/"
# funciona, pero en una location exacta (= /gd/api/auth/login) o mas profunda
# (/gd/api/guias/) borra la ruta completa y el backend recibe "/". El sintoma es peor que
# un error: la API responde 200 con el index.html de Angular, y el login llega como POST /
# y devuelve 405. Con rewrite el resultado no depende de cuanto matcheo la location.
rewrite ^/gd/?(.*)$ /$1 break;
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# Generar una ruta geocodifica con OpenStreetMap, que exige esperar un segundo entre
# consultas: con 15 guias sin ubicar son ~15 s antes de que el backend responda.
proxy_read_timeout 120s;

# --- Cabeceras de seguridad ---
#
# Van en este snippet y no en el sitio porque certbot reescribe
# /etc/nginx/sites-available/apps al renovar el certificado y se las llevaria por delante.
#
# HSTS SIN includeSubDomains a proposito: calimport.cl tiene otros subdominios que no
# controlamos desde aca (externos, correo), y forzarles HTTPS a todos dejaria inaccesible
# cualquiera que todavia sirva por HTTP, sin que nadie entienda por que. Un ano es lo
# recomendado; el navegador lo ignora cuando llega por HTTP, asi que solo cuenta el 443.
add_header Strict-Transport-Security "max-age=31536000" always;

# El build de Angular no trae ningun script inline ni recurso externo —verificado sobre el
# index.html compilado—, asi que script-src queda estricto. 'unsafe-inline' va solo para
# estilos, porque el CLI inyecta el CSS critico en un <style> del index. blob: es para las
# fotos de entrega: se bajan con token y se muestran como object URL, no por su ruta.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Que el folio o el id de una guia no viaje en el Referer hacia Google Maps o Waze cuando
# el repartidor abre la navegacion.
add_header Referrer-Policy "same-origin" always;
