# Archivo: deploy/nginx-apps-guias.conf
# Sitio de nginx para https://apps.calimport.cl cuando Guias es la UNICA aplicacion
# de la VM. Se copia a /etc/nginx/sites-available/apps.
#
# El diseño de la VM "apps" contempla dos aplicaciones (ver el README de
# Panel-Facturadores): el Dashboard Logistica en /logistica-comercial/ y Guias en /gd/.
# Ese repositorio trae su propio nginx-apps.conf con las dos. Este archivo existe porque
# hoy el panel no esta instalado, y aquel sitio no arranca si falta el snippet del panel:
# nginx se niega a cargar un include que apunta a un archivo inexistente.
#
# preparar-vm.sh lo instala SOLO si no hay ya un sitio "apps". Cuando el panel llegue,
# su instalar.sh pone el de dos aplicaciones y este queda sin efecto.
#
# El bloque HTTPS no esta aca: lo agrega certbot --nginx sobre este mismo archivo.

# Freno a la fuerza bruta antes de llegar a la app: 5 intentos de login por minuto por IP.
limit_req_zone $binary_remote_addr zone=login_gd:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name apps.calimport.cl;

    # Sin esto, un archivo subido a medias da un 413 de nginx en vez del mensaje de la app.
    client_max_body_size 16k;

    location = /gd {
        return 301 /gd/;
    }

    location = /gd/api/auth/login {
        limit_req zone=login_gd burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        include /etc/nginx/snippets/guias-proxy.conf;
    }

    # Las fotos de entrega son de camara de celular: el frontend las comprime a
    # ~250 KB, pero 10 MB es el tope que acepta el backend y aca no puede ser menor,
    # o nginx cortaria la subida con un 413 antes de que la app pueda explicarlo.
    #
    # Va como expresion regular y no como prefijo "/gd/api/guias/": con la barra final,
    # nginx responde un 301 a /gd/api/guias/ cuando el frontend pide /gd/api/guias, y
    # Spring no mapea la barra sobrante. La regex cubre la ruta exacta y las de abajo.
    location ~ ^/gd/api/guias(/|$) {
        client_max_body_size 10m;
        include /etc/nginx/snippets/guias-proxy.conf;
    }

    location /gd/ {
        include /etc/nginx/snippets/guias-proxy.conf;
    }

    # Nada mas existe. No revela que otras aplicaciones viven aca.
    location / {
        return 404;
    }
}
