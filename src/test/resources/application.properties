spring.application.name=guias-backend-test

# H2 en modo PostgreSQL, corriendo las MISMAS migraciones de Flyway que produccion.
# Asi los tests fallan si una migracion y una entidad se desincronizan, en vez de
# descubrirlo al desplegar.
spring.datasource.url=jdbc:h2:mem:guias;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Valores ficticios: ningun test sale a la red. El secret solo necesita cumplir el
# minimo de 32 caracteres que exige JwtTokenProvider.
sap.service-layer.base-url=http://localhost:9999
sap.service-layer.company-db=TEST_DB
sap.service-layer.username=test
sap.service-layer.password=test
sap.service-layer.trust-self-signed=false

security.jwt.secret=test-secret-de-al-menos-32-caracteres-para-hmac
security.jwt.access-token-ttl-minutes=480
