# Perfil para correr el MVP en un PC, sin SAP y sin GCP:
#   spring-boot:run -Dspring-boot.run.profiles=local
# Nada de lo que hay aca sirve para produccion.

# Postgres local: el mismo motor que produccion, para que lo que se prueba aca valga alla.
# La BASE hay que crearla una sola vez a mano (Flyway crea tablas, no bases):
#   createdb -U postgres guias_local
# Las TABLAS las crea Flyway en cada arranque si faltan, con las mismas migraciones de
# produccion. Para empezar de cero: DROP DATABASE guias_local y volver a crearla.
#
# No se fija driver-class-name a proposito: Spring lo deduce de la URL, y asi PerfilLocalTest
# puede apuntar este mismo perfil a H2 en memoria sin arrastrar el driver de Postgres.
#
# La clave sale de DB_PASSWORD y, si no esta, de la PGPASSWORD que ya usan psql y pg_dump:
# asi no hay que definir la misma contraseña dos veces en el PC de desarrollo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/guias_local}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres}}

# Login contra los usuarios de abajo en vez de SAP EmployeesInfo.
auth.modo=local
auth.local.usuarios[0].employee-id=1
auth.local.usuarios[0].nombre=Repartidor Uno
auth.local.usuarios[0].email=uno@calimport.local
auth.local.usuarios[0].password=1234
auth.local.usuarios[1].employee-id=2
auth.local.usuarios[1].nombre=Repartidor Dos
auth.local.usuarios[1].email=dos@calimport.local
auth.local.usuarios[1].password=1234
auth.local.usuarios[2].employee-id=9
auth.local.usuarios[2].nombre=Jefe de Bodega
auth.local.usuarios[2].email=jefe@calimport.local
auth.local.usuarios[2].password=1234
auth.local.usuarios[2].rol=JEFE_BODEGA

# Carga los usuarios de arriba y 15 guias de ejemplo si la tabla guia esta vacia
# (DatosLocales). Quince y no cinco para poder armar una ruta grande de verdad.
local.datos-de-prueba=true

# Rutas sin costo: OpenStreetMap ubica las direcciones y el backend calcula el orden (ver
# application.properties). Bodega: Padre Orellana 1236, Santiago Centro.
rutas.origen-latitud=-33.458472
rutas.origen-longitud=-70.631971
# Para usar Google en vez de lo gratuito: rutas.geocodificador=google, rutas.optimizador=google
# y/o rutas.comentarios=gemini, con google.maps-api-key, google.project-id y
#   gcloud auth application-default login

# Fotos de entrega en disco, dentro de ./data.
fotos.directorio=./data/fotos

security.jwt.secret=secret-solo-para-desarrollo-local-no-usar-en-produccion
security.jwt.access-token-ttl-minutes=720

# SAP no se usa en este perfil, pero sus beans arrancan igual: una URL que no responde
# hace que un POST /api/guias/sincronizar falle con 502 en vez de colgarse.
sap.service-layer.base-url=http://localhost:1

# Cada entrega o rechazo intenta reflejarse en SAP y aca falla siempre, a proposito: es la
# misma ruta que en produccion cuando el Service Layer esta caido, y sirve para comprobar
# que la guia igual queda registrada y la app sigue andando. Lo unico que se apaga es el
# reintento automatico, que sin SAP solo llenaria el log (un dia en vez de dos minutos).
guias.sync.reintento-ms=86400000

# La app Angular, servida por el mismo jar: se copia el build de ../Frontend a ./static
# (ver CLAUDE.md). Asi el celular entra por la IP del PC sin dev server ni CORS.
# Si ./static no existe todavia, cae en la pantalla minima de local-ui.
spring.web.resources.static-locations=file:./static/,classpath:/local-ui/
