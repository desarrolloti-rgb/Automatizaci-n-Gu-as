spring.application.name=guias-backend

# La app Angular se sirve desde una carpeta junto al jar, igual que en Dashboard: el build
# de ../Frontend se copia a ./static y no se empaqueta dentro del jar, asi el frontend se
# actualiza sin recompilar el backend. STATIC_DIR permite moverla en el servidor.
spring.web.resources.static-locations=${STATIC_DIR:file:./static/}

# Credenciales por variable de entorno: nunca commitear una password.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway es el dueno del esquema; Hibernate solo verifica que las entidades cuadren
# con las tablas. Si agregas un campo y olvidas la migracion, la app no arranca y te
# lo dice, en vez de reventar mas tarde con "column does not exist".
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

sap.service-layer.base-url=${SAP_BASE_URL:}
sap.service-layer.company-db=${SAP_COMPANY_DB:}
sap.service-layer.username=${SAP_USERNAME:}
sap.service-layer.password=${SAP_PASSWORD:}
sap.service-layer.trust-self-signed=${SAP_TRUST_SELF_SIGNED:false}

# Condicion OData extra para la sincronizacion, ademas de la fecha. Sirve para separar
# las guias que despacha Calimport de las que retira el cliente. Vacio = trae todas.
# Candidato a probar: U_TipoDesp eq '2' (despacho por cuenta del emisor, segun el DTE).
guias.sync.filtro-extra=${GUIAS_SYNC_FILTRO_EXTRA:}

# Despachadores externos, separados por coma: las guias cuyo pie dice "TRANSPORTE: SAMEX" o
# "DESPACHAR VIA SAMEX A" no se importan, porque no las lleva un repartidor de Calimport.
# Vacio = se importan todas (es como se apaga el filtro cuando se integren a la app).
guias.sync.transportistas-externos=${GUIAS_SYNC_TRANSPORTISTAS_EXTERNOS:SAMEX}

# Transportistas externos que bodega puede elegir en la app ("Despacho externo: SAMEX"), en el
# mismo selector que el repartidor. Separados por coma; vacio = no se puede marcar ninguna.
guias.transportistas=${GUIAS_TRANSPORTISTAS:SAMEX}

# /api/integraciones (el lector del portal de Samex, en Cloud Run): el ID token de Google con que se
# identifica tiene que traer esta audiencia y venir de una de estas cuentas de servicio (separadas
# por coma). La audiencia distingue produccion de la instancia de prueba. Vacias = /api/integraciones
# rechaza todo, que es como queda hasta configurarlas.
guias.integraciones.audiencia=${GUIAS_INTEGRACIONES_AUDIENCIA:}
guias.integraciones.cuentas=${GUIAS_INTEGRACIONES_CUENTAS:}

# Que hace la app cuando Samex da por entregada una guia y llega su PDF. "registrar" (defecto):
# lo anota todo sin tocar la guia, la etapa sombra para medir el cruce. "cerrar": ademas la deja
# ENTREGADA con la hora de Samex y le avisa a SAP. Otro valor no arranca.
guias.samex.modo=${GUIAS_SAMEX_MODO:registrar}

# Si los UDF del ciclo de ultima milla (U_EstadoLog, U_Despachador, U_UrlFoto,
# U_MotivoRech) ya existen en DeliveryNotes.
#
# Al 28-09-2026 existen en CALIMPORT_PRODUCTIVO (UserFieldsMD, tabla ODLN): EstadoLog 25,
# Despachador 25, MotivoRech 20, UrlFoto 100. La VM los activa con GUIAS_SAP_UDF_ESTADO=true.
#
# El default sigue en FALSE para desarrollo: en CALIMPORT_TEST miden 10 (UrlFoto 50) y el
# PATCH con una URL o un nombre real falla. Donde no existen, pedirlos no devuelve vacio:
# devuelve 400 "Property 'U_EstadoLog' of 'Document' is invalid" y tumba la sincronizacion.
#
# En false la app funciona contra Postgres: el repartidor entrega y rechaza normalmente,
# solo que SAP no se entera. En true se activan el filtro de la sincronizacion
# (U_EstadoLog 'P' o vacio) y el envio del estado.
guias.sap.udf-estado-logistico=${GUIAS_SAP_UDF_ESTADO:false}

# Si existen U_Dateguia (fecha) y U_Horaguia (hora), donde va cuando se entrego la guia, en
# hora de Chile. Solo cuenta con udf-estado-logistico en true: viajan en el mismo PATCH.
#
# Al 05-11-2026 existen en CALIMPORT_TEST y NO en CALIMPORT_PRODUCTIVO. Va aparte porque
# mandar un UDF que no existe hace que SAP rechace el PATCH entero con 400: no llegarian ni
# el estado ni la foto. Activar en produccion recien cuando esten creados alla.
guias.sap.udf-fecha-entrega=${GUIAS_SAP_UDF_FECHA_ENTREGA:false}

# Dominio publico de la app. Se le antepone a la ruta de la foto al escribir U_UrlFoto en
# SAP, donde la mira alguien de afuera y una ruta relativa no le sirve de nada.
guias.url-publica=${GUIAS_URL_PUBLICA:}
# Cada cuanto se reintenta enviar a SAP lo que quedo sin sincronizar.
guias.sync.reintento-ms=${GUIAS_SYNC_REINTENTO_MS:120000}

# Rutas de reparto. Cada paso tiene una version gratuita (por defecto) y una de Google:
#   rutas.geocodificador = osm (OpenStreetMap)     | google (Geocoding API, pagada)
#                        | cascada (OSM y, solo si no encuentra nada, Google)
#
# "cascada" existe porque Nominatim busca por coincidencia exacta y las direcciones de SAP
# no vienen exactas: de cinco que fallaron en produccion, dos eran errores de tipeo
# ("VICUNA MACKENA", "DOMINGO ARTEGA") que ninguna limpieza de texto arregla. Con cascada
# se paga solo lo que OSM ubicaria apenas en su comuna; una direccion que OSM ubica aunque
# sea aproximada no llega a Google. Necesita GOOGLE_MAPS_API_KEY.
#   rutas.optimizador    = local (calculo propio)  | google (Route Optimization, pagada)
#   rutas.comentarios    = reglas (patrones fijos) | gemini (Vertex AI, pagado)
# Con las gratuitas solo hace falta la ubicacion de la bodega (rutas.origen-*).
rutas.geocodificador=${RUTAS_GEOCODIFICADOR:osm}
rutas.optimizador=${RUTAS_OPTIMIZADOR:local}
rutas.comentarios=${RUTAS_COMENTARIOS:reglas}
rutas.velocidad-promedio-kmh=${RUTAS_VELOCIDAD_KMH:25}
rutas.osm-user-agent=${RUTAS_OSM_USER_AGENT:calimport-guias/1.0}

# Google (solo si algun paso usa "google" o "gemini"). Sin estos valores la app arranca igual;
# lo que falla es generar una ruta, con un mensaje que dice que falta.
# Route Optimization y Vertex AI se autentican con Application Default Credentials (la
# cuenta de servicio en Cloud Run); Geocoding usa API key.
google.project-id=${GCP_PROJECT_ID:}
google.maps-api-key=${GOOGLE_MAPS_API_KEY:}
google.gemini-location=${GEMINI_LOCATION:global}
google.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

# Coordenadas de la bodega, desde donde salen los repartidores.
rutas.origen-latitud=${RUTAS_ORIGEN_LAT:}
rutas.origen-longitud=${RUTAS_ORIGEN_LNG:}
rutas.minutos-por-parada=${RUTAS_MINUTOS_POR_PARADA:10}
rutas.paradas-por-tramo-maps=${RUTAS_PARADAS_POR_TRAMO_MAPS:10}
rutas.zona-horaria=America/Santiago

# Fotos de entrega. Son la evidencia de lo que paso en terreno:
#   fotos.almacen = disco (defecto: local y tests, en fotos.directorio)
#                 | gcs   (la VM: bucket fotos.bucket, sobrevive a perder la maquina)
# gcs usa Application Default Credentials: en la VM, su cuenta de servicio, que solo puede
# crear y leer objetos del bucket (deploy/crear-bucket.ps1). Sin bucket la app no arranca.
fotos.almacen=${FOTOS_ALMACEN:disco}
fotos.directorio=${FOTOS_DIRECTORIO:./data/fotos}
fotos.bucket=${FOTOS_BUCKET:}
# Una foto de celular pesa 3-5 MB; el default de Spring (1 MB) las rechazaria.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Correo al cliente cuando se entrega su despacho (CorreoDespachoService): al correo de su
# ficha en SAP (EmailAddress), con la foto adjunta y copia oculta interna. Apagado por
# defecto. Lo envia un proceso aparte cada ciclo-ms, no la entrega, y reintenta con espera
# creciente hasta max-intentos.
correo.despacho.habilitado=${CORREO_DESPACHO:false}
correo.despacho.remitente=${CORREO_DESPACHO_REMITENTE:noreply@calimport.cl}
# Copia oculta interna, separada por comas. Vacia = sin copia.
correo.despacho.copia=${CORREO_DESPACHO_COPIA:}
# Casilla a la que llega si el cliente responde. Vacia = el correo pide no responder.
correo.despacho.responder-a=${CORREO_DESPACHO_RESPONDER_A:}
# PRUEBAS: todo va a esta casilla y no al cliente. Obligatoria contra la base TEST de SAP,
# que tiene los correos reales de los clientes (la app no arranca sin ella).
correo.despacho.desvio=${CORREO_DESPACHO_DESVIO:}
correo.despacho.max-intentos=${CORREO_DESPACHO_MAX_INTENTOS:12}
correo.despacho.ciclo-ms=${CORREO_DESPACHO_CICLO_MS:60000}

# Resend por SMTP, igual que el Dashboard: el usuario es literalmente "resend" y la clave es
# la API key. Solo se exige con CORREO_DESPACHO=true.
spring.mail.host=${SMTP_HOST:smtp.resend.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:resend}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# STARTTLS obligatorio y con el certificado validado contra el host: si no, la API key viaja
# en claro o a quien se ponga en el medio.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# Sin timeouts JavaMail espera para siempre, y con el SMTP colgado se trabaria tambien el
# reintento a SAP, que corre en el mismo hilo de tareas programadas.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

security.jwt.secret=${JWT_SECRET:}
# Una jornada de reparto (12 h): la app instalada en el celular guarda la sesion y el
# repartidor no tiene que volver a entrar a mitad del turno.
security.jwt.access-token-ttl-minutes=${JWT_TTL_MINUTES:720}

# Sesion comun con el Panel de Facturadores, solo para el jefe de bodega (SesionComun). El
# secreto es el MISMO SESION_COMUN_SECRETO del .env del panel. Vacio = apagada: asi quedan
# el perfil local y la instancia de prueba, que comparte dominio con produccion.
sesion-comun.secreto=${SESION_COMUN_SECRETO:}
sesion-comun.cookie=${SESION_COMUN_COOKIE:calimport_sesion}
# Dias SIN USO: cada canje la vuelve a emitir.
sesion-comun.dias=${SESION_COMUN_DIAS:30}
sesion-comun.cookie-segura=${SESION_COMUN_COOKIE_SEGURA:true}

