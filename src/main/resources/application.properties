spring.application.name=guias-backend

# Credenciales por variable de entorno: nunca commitear una password.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway es el dueno del esquema; Hibernate solo verifica que las entidades cuadren
# con las tablas. Si agregas un campo y olvidas la migracion, la app no arranca y te
# lo dice, en vez de reventar mas tarde con "column does not exist".
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

sap.service-layer.base-url=${SAP_BASE_URL:}
sap.service-layer.company-db=${SAP_COMPANY_DB:}
sap.service-layer.username=${SAP_USERNAME:}
sap.service-layer.password=${SAP_PASSWORD:}
sap.service-layer.trust-self-signed=${SAP_TRUST_SELF_SIGNED:false}

# Condicion OData extra para la sincronizacion, ademas de la fecha. Sirve para separar
# las guias que despacha Calimport de las que retira el cliente. Vacio = trae todas.
# Candidato a probar: U_TipoDesp eq '2' (despacho por cuenta del emisor, segun el DTE).
guias.sync.filtro-extra=${GUIAS_SYNC_FILTRO_EXTRA:}

security.jwt.secret=${JWT_SECRET:}
security.jwt.access-token-ttl-minutes=${JWT_TTL_MINUTES:480}

