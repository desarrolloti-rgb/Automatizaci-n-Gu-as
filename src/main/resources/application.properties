spring.application.name=guias-backend

sap.service-layer.base-url=${SAP_BASE_URL:}
sap.service-layer.company-db=${SAP_COMPANY_DB:}
sap.service-layer.username=${SAP_USERNAME:}
sap.service-layer.password=${SAP_PASSWORD:}
sap.service-layer.trust-self-signed=${SAP_TRUST_SELF_SIGNED:false}

security.jwt.secret=${JWT_SECRET:}
security.jwt.access-token-ttl-minutes=${JWT_TTL_MINUTES:480}

