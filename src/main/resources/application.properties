spring.application.name=guias-backend

# La app Angular se sirve desde una carpeta junto al jar, igual que en Dashboard: el build
# de ../Frontend se copia a ./static y no se empaqueta dentro del jar, asi el frontend se
# actualiza sin recompilar el backend. STATIC_DIR permite moverla en el servidor.
spring.web.resources.static-locations=${STATIC_DIR:file:./static/}

# Credenciales por variable de entorno: nunca commitear una password.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway es el dueno del esquema; Hibernate solo verifica que las entidades cuadren
# con las tablas. Si agregas un campo y olvidas la migracion, la app no arranca y te
# lo dice, en vez de reventar mas tarde con "column does not exist".
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

sap.service-layer.base-url=${SAP_BASE_URL:}
sap.service-layer.company-db=${SAP_COMPANY_DB:}
sap.service-layer.username=${SAP_USERNAME:}
sap.service-layer.password=${SAP_PASSWORD:}
sap.service-layer.trust-self-signed=${SAP_TRUST_SELF_SIGNED:false}

# Condicion OData extra para la sincronizacion, ademas de la fecha. Sirve para separar
# las guias que despacha Calimport de las que retira el cliente. Vacio = trae todas.
# Candidato a probar: U_TipoDesp eq '2' (despacho por cuenta del emisor, segun el DTE).
guias.sync.filtro-extra=${GUIAS_SYNC_FILTRO_EXTRA:}

# Si los UDF del ciclo de ultima milla (U_EstadoLog, U_Despachador, U_UrlFoto,
# U_MotivoRech) ya existen en DeliveryNotes.
#
# Arranca en FALSE porque al 22-09-2026 NO existen en CALIMPORT_PRODUCTIVO: se verifico
# contra el Service Layer real y el documento trae 107 UDF, ninguno de estos cuatro.
# Pedirlos igual no devuelve vacio, devuelve 400 "Property 'U_EstadoLog' of 'Document'
# is invalid" y tumba la sincronizacion entera.
#
# En false la app funciona como antes, contra Postgres: el repartidor entrega y rechaza
# normalmente, solo que SAP no se entera. Se pone en true el dia que los creen, y ahi se
# activan el filtro de la sincronizacion y el envio del estado.
guias.sap.udf-estado-logistico=${GUIAS_SAP_UDF_ESTADO:false}

# Dominio publico de la app. Se le antepone a la ruta de la foto al escribir U_UrlFoto en
# SAP, donde la mira alguien de afuera y una ruta relativa no le sirve de nada.
guias.url-publica=${GUIAS_URL_PUBLICA:}
# Cada cuanto se reintenta enviar a SAP lo que quedo sin sincronizar.
guias.sync.reintento-ms=${GUIAS_SYNC_REINTENTO_MS:120000}

# Rutas de reparto. Cada paso tiene una version gratuita (por defecto) y una de Google:
#   rutas.geocodificador = osm (OpenStreetMap)     | google (Geocoding API, pagada)
#   rutas.optimizador    = local (calculo propio)  | google (Route Optimization, pagada)
#   rutas.comentarios    = reglas (patrones fijos) | gemini (Vertex AI, pagado)
# Con las gratuitas solo hace falta la ubicacion de la bodega (rutas.origen-*).
rutas.geocodificador=${RUTAS_GEOCODIFICADOR:osm}
rutas.optimizador=${RUTAS_OPTIMIZADOR:local}
rutas.comentarios=${RUTAS_COMENTARIOS:reglas}
rutas.velocidad-promedio-kmh=${RUTAS_VELOCIDAD_KMH:25}
rutas.osm-user-agent=${RUTAS_OSM_USER_AGENT:calimport-guias/1.0}

# Google (solo si algun paso usa "google" o "gemini"). Sin estos valores la app arranca igual;
# lo que falla es generar una ruta, con un mensaje que dice que falta.
# Route Optimization y Vertex AI se autentican con Application Default Credentials (la
# cuenta de servicio en Cloud Run); Geocoding usa API key.
google.project-id=${GCP_PROJECT_ID:}
google.maps-api-key=${GOOGLE_MAPS_API_KEY:}
google.gemini-location=${GEMINI_LOCATION:global}
google.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

# Coordenadas de la bodega, desde donde salen los repartidores.
rutas.origen-latitud=${RUTAS_ORIGEN_LAT:}
rutas.origen-longitud=${RUTAS_ORIGEN_LNG:}
rutas.minutos-por-parada=${RUTAS_MINUTOS_POR_PARADA:10}
rutas.paradas-por-tramo-maps=${RUTAS_PARADAS_POR_TRAMO_MAPS:10}
rutas.zona-horaria=America/Santiago

# Fotos de entrega. Hoy se guardan en disco: sirve en local o en una VM, no en Cloud Run
# (su disco se borra al reiniciar), donde habra que pasarlas a Cloud Storage.
fotos.directorio=${FOTOS_DIRECTORIO:./data/fotos}
# Una foto de celular pesa 3-5 MB; el default de Spring (1 MB) las rechazaria.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Emails (separados por coma) que entran como JEFE_BODEGA con login SAP. Provisorio hasta
# confirmar de que campo de EmployeesInfo sale el rol; el resto entra como REPARTIDOR.
auth.jefes-bodega=${AUTH_JEFES_BODEGA:}

security.jwt.secret=${JWT_SECRET:}
security.jwt.access-token-ttl-minutes=${JWT_TTL_MINUTES:480}

